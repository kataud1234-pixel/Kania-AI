    // ==========================================

    function App() {
      const [lang, setLang] = useState("id");
      const t = DICTIONARY[lang];

      const [activePage, setActivePage] = useState("home");
      const [step, setStep] = useState(1);

      const [profile, setProfile] = useState(DEMO_DATA_ID.profile);
      const [competitors, setCompetitors] = useState(DEMO_DATA_ID.competitors);
      const [evidences, setEvidences] = useState(DEMO_DATA_ID.evidences);

      const [analysisResult, setAnalysisResult] = useState(null);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [adoptedOptions, setAdoptedOptions] = useState([]);

      const handleLanguageSwitch = (newLang) => {
        setLang(newLang);
        const isDefaultId = profile.name === DEMO_DATA_ID.profile.name;
        const isDefaultEn = profile.name === DEMO_DATA_EN.profile.name;
        if (isDefaultId || isDefaultEn) {
          if (newLang === "en") {
            setProfile(DEMO_DATA_EN.profile);
            setCompetitors(DEMO_DATA_EN.competitors);
            setEvidences(DEMO_DATA_EN.evidences);
          } else {
            setProfile(DEMO_DATA_ID.profile);
            setCompetitors(DEMO_DATA_ID.competitors);
            setEvidences(DEMO_DATA_ID.evidences);
          }
          setAnalysisResult(null);
          setAdoptedOptions([]);
        }
      };

      const loadDemoData = () => {
        if (lang === "en") {
          setProfile(DEMO_DATA_EN.profile);
          setCompetitors(DEMO_DATA_EN.competitors);
          setEvidences(DEMO_DATA_EN.evidences);
        } else {
          setProfile(DEMO_DATA_ID.profile);
          setCompetitors(DEMO_DATA_ID.competitors);
          setEvidences(DEMO_DATA_ID.evidences);
        }
        setAnalysisResult(null);
        setAdoptedOptions([]);
      };

      const clearFormData = () => {
        setProfile({
          name: "",
          category: "",
          offers: "",
          targetCustomer: "",
          location: "",
          priceRange: "",
          channels: "",
          valueProposition: "",
          styleServiceAttributes: "",
          strategicQuestion: ""
        });
        setCompetitors([]);
        setEvidences([]);
        setAnalysisResult(null);
        setAdoptedOptions([]);
      };

      // Evaluasi data riil dinamis sesuai input pengguna
      const executeAnalysis = () => {
        setIsAnalyzing(true);

        setTimeout(() => {
          const activeCompetitors = competitors.filter(c => c.confirmed);
          const isEnglish = lang === "en";
          const userBrand = profile.name.trim() || (isEnglish ? "Your Business" : "Bisnis Anda");
          const userCategory = profile.category.trim() || (isEnglish ? "General Industry" : "Industri Umum");

          const compNames = activeCompetitors.map(c => c.name).join(", ") || (isEnglish ? "general alternatives" : "alternatif sejenis");
          const allEvidenceText = evidences.map(e => e.rawExcerpt).join(" ");
          const evidenceRefs = evidences.map(e => e.id);

          const dynamicSummary = isEnglish
            ? `Strategic evaluation for ${userBrand} in the ${userCategory} sector indicates clear potential against ${compNames}. By building on your value proposition of "${profile.valueProposition || 'tailored customer value'}", your enterprise can avoid commoditization and directly solve customer friction highlighted in evidence records (${evidenceRefs.join(', ') || 'user-supplied'}).`
            : `Evaluasi strategis untuk ${userBrand} di sektor ${userCategory} memperlihatkan potensi keunggulan yang nyata terhadap ${compNames}. Berlandaskan proposisi nilai "${profile.valueProposition || 'nilai pelanggan khusus'}", bisnis Anda dapat menghindari jebakan perang harga dan menjawab keluhan pelanggan yang tercatat dalam bukti (${evidenceRefs.join(', ') || 'bukti terdaftar'}).`;

          const quadrantPoints = [
            { label: userBrand, x: 6.5, y: 7.0, isUser: true, ref: "Profile" }
          ];

          activeCompetitors.forEach((comp, idx) => {
            const factor = idx % 2 === 0 ? -1 : 1;
            quadrantPoints.push({
              label: comp.name,
              x: factor * (5.0 + idx * 1.5),
              y: -factor * (4.0 + idx * 1.2),
              isUser: false,
              ref: evidenceRefs[idx] || "Observed"
            });
          });

          const customerSignals = [
            {
              type: "pain",
              theme: isEnglish ? "Friction in Competing Alternatives" : "Ketidakpuasan terhadap Solusi Kompetitor",
              description: isEnglish
                ? `Customer excerpts indicate fatigue with current market options: "${allEvidenceText.slice(0, 90) || 'Generic service lacking personalization'}..."`
                : `Kutipan ulasan pelanggan menyoroti kelemahan opsi pasar saat ini: "${allEvidenceText.slice(0, 90) || 'Pelayanan umum yang kurang personal'}..."`,
              evidenceRefs: evidenceRefs.slice(0, 2)
            },
            {
              type: "need",
              theme: isEnglish ? "Demand for Distinctive Experience" : "Kebutuhan akan Pengalaman Lebih Otentik",
              description: isEnglish
                ? `Target segment (${profile.targetCustomer || 'core buyers'}) seeks reliable quality without inflated transactional hype.`
                : `Segmen sasaran (${profile.targetCustomer || 'pelanggan utama'}) menginginkan kepastian kualitas tanpa gimmick pemasaran berlebih.`,
              evidenceRefs: evidenceRefs.slice(1, 3)
            }
          ];

          const strategyOptions = [
            {
              id: "OPT-1",
              title: isEnglish ? "Signature Value Anchor" : "Penguatan Nilai Unggulan Mandiri",
              description: isEnglish
                ? `Reinforce "${profile.valueProposition || 'Authentic Offer'}" explicitly across marketing channels (${profile.channels || 'digital'}).`
                : `Tegaskan keunggulan "${profile.valueProposition || 'Penawaran Otentik'}" secara konsisten di saluran (${profile.channels || 'digital'}).`,
              rationale: isEnglish ? "Directly counters generic competitor offerings without margin loss." : "Menghalau perang harga dengan memperkuat daya tawar emosional.",
              evidenceRefs: evidenceRefs.slice(0, 2)
            },
            {
              id: "OPT-2",
              title: isEnglish ? "Targeted Friction-Free Journey" : "Penyempurnaan Jalur Pelayanan Pelanggan",
              description: isEnglish
                ? `Address dilemma: "${profile.strategicQuestion || 'How to differentiate sustainably?'}" by streamlining post-purchase support.`
                : `Menjawab tantangan: "${profile.strategicQuestion || 'Bagaimana diferensiasi yang kokoh?'}" dengan pelayanan ramah dan cepat.`,
              rationale: isEnglish ? "Leverages observed customer feedback gaps." : "Memanfaatkan celah ulasan negatif yang dialami kompetitor.",
              evidenceRefs: evidenceRefs.slice(1, 3)
            }
          ];

          setAnalysisResult({
            summary: dynamicSummary,
